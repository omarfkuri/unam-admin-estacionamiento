<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="dark light">

	<link rel="stylesheet" href="/unam-admin-estacionamiento/css/style.css">
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="/unam-admin-estacionamiento/js/page/principal/index.js" type="module" defer></script>

	<title>EasyPark – Principal</title>
</head>
<body>
	<div class="topbar">
		<div class="logo">EasyPark</div>
	</div>

	<div class="content">
		<div class="top">
			<div class="first card">
				Bienvenido al sistema, <b id="usuarioBox"></b>.
			</div>

			<div class="card">
				<button id="cerrarSesionBtn">Cerrar sesión</button>
			</div>
		</div>

		<div class="middle">
			<div class="card number-bar">
				<div class="title">Vehículos registrados</div>
				<div class="number">4</div>
			</div>

			<div class="card number-bar">
				<div class="title">Lugares ocupados</div>
				<div class="number">2</div>
			</div>

			<div class="card number-bar">
				<div class="title">Notificaciones</div>
				<div class="number">0</div>
			</div>
		</div>

		<div class="bottom">
			<div class="card">
				<h2>Bloomware</h2>

				<ol>
					<li>Freaner Kuri Omar – <b>Líder</b></li>
					<li>De la Cruz Roque Isaid – <b>Estilador</b></li>
					<li>Guerra Córdova Emiliano</li>
					<li>Jarquín Ordaz Ariadna</li>
					<li>Lozano Ortiz Karen</li>
					<li>Vargas Pérez Patricia Victoria</li>
				</ol>
			</div>
		</div>
	</div>
	<style>
		
		.top
		{
			display: flex;
			gap: 10px;

			.first
			{
				width: 100%;
			}
		}

		.middle
		{
			display: flex;
			gap: 10px;

			.card
			{
				width: 100%;
			}

			.number-bar
			{
				display: flex;
				justify-content: space-between;
				align-items: center;

				.title
				{
					font-size: .6em;
				}

				.number
				{
					text-align: right;
					font-weight: bold;
				}
			}
		}
		
		.bottom
		{
			display: flex;

			.card
			{
				width: 100%;
			}
		}

	</style>
</body>
</html>
